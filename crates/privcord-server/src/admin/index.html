<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script src="/admin/theme.js"></script>
<title>PrivCord server</title>
<link rel="stylesheet" href="/admin/app.css">
<link rel="icon" href="/admin/brand.svg" type="image/svg+xml">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<header class="bar">
  <div class="col bar-in">
    <h1 class="brand"><img src="/admin/brand.svg" alt="" width="30" height="30"><span class="name">PrivCord</span><span class="kind">server</span></h1>
    <div class="who" id="who" hidden>
      <button type="button" class="adv-switch" id="adv" role="switch" aria-checked="false"><span class="track" aria-hidden="true"></span><span>Advanced</span></button>
      <button type="button" class="icon-btn" id="theme"></button>
      <button type="button" class="btn ghost sm" id="signout">Sign out</button>
    </div>
  </div>
</header>

<main class="col">
  <section id="login" class="login" aria-labelledby="loginTitle">
    <h2 id="loginTitle">Sign in</h2>
    <p class="lead">Paste your admin token. It was shown once when the server first started, or you can make one with <code>privcord-server admin-token</code>.</p>
    <form id="loginForm" autocomplete="off">
      <label for="token">Admin token</label>
      <input id="token" name="token" type="password" spellcheck="false" autocapitalize="off" autocomplete="off" required>
      <p id="loginError" class="msg bad" role="alert" hidden></p>
      <button type="submit" class="btn primary">Sign in</button>
    </form>
  </section>

  <div id="app" hidden>
    <nav aria-label="Sections"><div class="tabs" role="tablist" id="tabs"></div></nav>
    <div id="status" class="sr" role="status" aria-live="polite"></div>
    <div id="view" role="tabpanel" tabindex="-1"></div>
  </div>
</main>
<script src="/admin/app.js"></script>
</body>
</html>
