name: Test builds

# Builds UNSIGNED installers you can try (Actions run > Artifacts). Every merge to main (except site/ and root .md
# changes) also replaces the files on the Android and Windows releases, which the website links to. A manual run
# publishes only if "publish" is ticked. Not a signed release: see docs/DEPLOYMENT.md.
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '*.md', '.gitignore', '.github/workflows/pages.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Also replace the files on the Android and Windows releases (the site links to them)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: test-builds
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer (unsigned)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # Keeps the compiled libraries between runs (OpenSSL and the database library alone take minutes), so a repeat build only
      # recompiles what changed. The desktop crate has its own Cargo.lock and target folder.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      # Every build is newer than the last (the updater needs that). With the update-signing key (a repository secret)
      # the build also makes the signed update files; without it, it is only an installer.
      - name: Build the installer
        # PowerShell, not bash: Git Bash puts Git's own Perl first, and the OpenSSL inside the encrypted database library
        # (built from source) needs the runner's Perl.
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $config = @{ version = "0.1.${{ github.run_number }}" }
          if ($env:TAURI_SIGNING_PRIVATE_KEY) { $config.bundle = @{ createUpdaterArtifacts = $true } }
          $config | ConvertTo-Json -Depth 5 | Set-Content -Path apps/desktop/ci-version.conf.json -Encoding utf8
          # Call the workspace directly: the root script forwards arguments to a second npm, which would take --config itself.
          # Tauri downloads its NSIS packager from github.com at the end; that has returned HTTP 504 before, so retry.
          for ($i = 1; $i -le 3; $i++) {
            npm --workspace @duochat/desktop run tauri:build -- --config ci-version.conf.json
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "tauri build failed (attempt $i of 3); retrying in 60 s"
            Start-Sleep -Seconds 60
          }
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: duochat-windows-unsigned
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Relay dependencies
        working-directory: relay
        run: npm ci
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null || true
      # The Rust core, built for the two phone CPU types and packed into the APK (apps/android/app/src/main/jniLibs).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build the Rust core for Android
        # The runner sets ANDROID_NDK_ROOT (not ANDROID_NDK_LATEST_HOME on this image).
        # Optimised for size on phones (messages and files are small; the APK download is not).
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          cargo ndk -t arm64-v8a -t armeabi-v7a \
            -o apps/android/app/src/main/jniLibs build -p privcord-ffi --release --locked
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        working-directory: apps/android
        # Signed with the release key when its secrets exist (DUOCHAT_KEYSTORE_*), else with the public test key.
        env:
          DUOCHAT_KEYSTORE_B64: ${{ secrets.DUOCHAT_KEYSTORE_B64 }}
          DUOCHAT_KEYSTORE_PASSWORD: ${{ secrets.DUOCHAT_KEYSTORE_PASSWORD }}
          DUOCHAT_KEY_ALIAS: ${{ secrets.DUOCHAT_KEY_ALIAS }}
          DUOCHAT_KEY_PASSWORD: ${{ secrets.DUOCHAT_KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleRelease -Pduochat.ciSign=true --console=plain
          -Pduochat.versionCode=${{ github.run_number }} -Pduochat.versionName=0.1.${{ github.run_number }}
      - name: Each APK contains the Rust core for its CPU type
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            unzip -l apps/android/app/build/outputs/apk/release/app-$abi-release.apk | grep "lib/$abi/libprivcord_ffi.so"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: duochat-android
          path: apps/android/app/build/outputs/apk/release/*.apk

  publish:
    name: Replace the release files
    if: github.event_name == 'push' || inputs.publish
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
      - name: Upload (the site and the apps' update checks use these exact names)
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          n=${{ github.run_number }}
          base="https://github.com/$GITHUB_REPOSITORY/releases/download"
          # Android: the APK and the small file the app reads to learn there is a newer build.
          cp out/duochat-android/app-arm64-v8a-release.apk PrivCord.apk
          sha=$(sha256sum PrivCord.apk | cut -d' ' -f1)
          printf '{"versionCode":%s,"versionName":"0.1.%s","url":"%s/Android/PrivCord.apk","sha256":"%s"}\n' "$n" "$n" "$base" "$sha" > android.json
          gh release upload Android PrivCord.apk android.json --clobber --repo "$GITHUB_REPOSITORY"
          # Windows: the installer, and (when it was signed) the update description the app reads.
          exe=$(ls out/duochat-windows-unsigned/*-setup.exe)
          cp "$exe" PrivCord-setup.exe
          gh release upload Windows PrivCord-setup.exe --clobber --repo "$GITHUB_REPOSITORY"
          if [ -f "$exe.sig" ]; then
            jq -n --arg v "0.1.$n" --arg s "$(cat "$exe.sig")" --arg u "$base/Windows/PrivCord-setup.exe" --arg d "$(date -u +%FT%TZ)" \
              '{version:$v,notes:"",pub_date:$d,platforms:{"windows-x86_64":{signature:$s,url:$u}}}' > latest.json
            gh release upload Windows latest.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "No update signature (the TAURI_SIGNING_PRIVATE_KEY secret is not set): latest.json not published."
          fi
          # The old, versioned file name is replaced by the fixed one above.
          gh release delete-asset Windows PrivCord_0.1.0_x64-setup.exe --yes --repo "$GITHUB_REPOSITORY" || true
          # Say on each release page which build it holds, so it is plain whether it is the latest.
          title=$(printf '%s' "${COMMIT_MESSAGE:-manual run}" | head -n 1)
          when=$(date -u '+%Y-%m-%d %H:%M UTC')
          for tag in Android Windows; do
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$([ "$tag" = Android ] && echo 'Android APK' || echo 'Windows exe') (build $n)" \
              --notes "Build $n, from commit ${GITHUB_SHA:0:7}, published $when.
          $title

          Unsigned test build: see docs/DEPLOYMENT.md. Full history: https://github.com/$GITHUB_REPOSITORY/commits/main"
          done
